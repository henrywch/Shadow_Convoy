name: Deploy Demo Site

on:
  push:
    branches: [main, demo]
    paths:
      - 'demo/**'
  workflow_dispatch:

permissions:
  contents: write

# Shared group with deploy.yml so the two never push to gh-pages at the same
# time (fixes the "cannot lock ref gh-pages" race when one push touches both).
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publishes demo/ into this repo's gh-pages branch under /Demo, served at
      # https://henrywch.github.io/Shadow_Convoy/Demo/ . keep_files preserves the
      # main pages/ site at the gh-pages root (and vice-versa). Uses the default
      # GITHUB_TOKEN — no extra secret needed (same repo).
      - name: Deploy demo/ to gh-pages /Demo
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./demo
          publish_branch: gh-pages
          destination_dir: Demo
          keep_files: true
          commit_message: "deploy demo: ${{ github.event.head_commit.message }}"
