name: Deploy Preview Website

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'

permissions:
  contents: write

# Both deploy workflows push to the same gh-pages branch; this shared group
# serializes them so they never race (the cause of "cannot lock ref gh-pages").
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy pages/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages
          keep_files: true   # was force_orphan; keep so the /Demo subdir survives
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
